plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.107'
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = neo_version

    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_mappings_version
    }

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.ithundxr.dev/snapshots' }

    exclusiveContent {
        forRepository {
            maven { url = 'https://api.modrinth.com/maven' }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    implementation("com.simibubi.create:create-1.21.1:${create_version}:slim") {
        transitive = false
    }
    implementation "net.createmod.ponder:ponder-neoforge:${ponder_version}"
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-1.21.1:${flywheel_version}"
    runtimeOnly "dev.engine-room.flywheel:flywheel-neoforge-1.21.1:${flywheel_version}"
    implementation "com.tterrag.registrate:Registrate:${registrate_version}"
    implementation "maven.modrinth:${copycats_project_id}:${copycats_version_id}"
}

def resourceProperties = [
    mod_id: mod_id,
    mod_name: mod_name,
    mod_version: mod_version,
    mod_authors: mod_authors,
    mod_license: mod_license,
    mod_description: mod_description,
    loader_version_range: loader_version_range,
    neo_version_range: neo_version_range,
    minecraft_version_range: minecraft_version_range,
    create_version_range: create_version_range,
    copycats_version_range: copycats_version_range,
]

processResources {
    inputs.properties resourceProperties

    filesMatching('META-INF/neoforge.mods.toml') {
        expand resourceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// ModDev run tasks otherwise inherit a closed stdin when Gradle is launched from a
// non-interactive wrapper, making dedicated-server console commands impossible.
tasks.withType(JavaExec).configureEach {
    standardInput = System.in
}
