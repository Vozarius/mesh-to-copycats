name: Deploy editor to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore production browser catalog
        run: |
          mkdir -p generated/catalog
          tar -xzf .github/pages/catalog.tar.gz -C generated/catalog

      - name: Verify production catalog
        run: pnpm web:catalog:verify

      - name: Build project site
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: pnpm --filter @mesh-to-copycats/web exec vite build

      - name: Verify Pages output
        shell: bash
        run: |
          test -f apps/web/dist/index.html
          test -f apps/web/dist/catalog/generated-shapes.bin
          test -f apps/web/dist/catalog/material-palette.json
          grep -Fq "/${{ github.event.repository.name }}/assets/" apps/web/dist/index.html
          grep -RFl "/${{ github.event.repository.name }}/catalog" apps/web/dist/assets/optimizer.worker-*.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      actions: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
